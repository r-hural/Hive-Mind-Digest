# Runs the project's tests on every push and pull request.
# Every action is pinned to a full commit SHA (the tag in the comment); a new action needs the
# same, or the release scan refuses the workflow. tests/test_repo_hygiene.py checks this file's
# shape (job `pytest`, the install steps, the empty API key on the test step).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip==26.2.1   # pinned, like every other install step
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pip install -e .
      - run: python -m pytest tests -q
        env:
          ANTHROPIC_API_KEY: ""      # the tests never bill
