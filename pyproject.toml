[build-system]
requires = ["setuptools==84.0.0"]   # the same pin as requirements.lock
build-backend = "setuptools.build_meta"

[project]
name = "hive-mind-digest"
version = "0.1.1"
description = "Multi-source research synthesis with verifiable claims"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0,<1.0",
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2026.2.21",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.2.2",
    "trafilatura>=2.3.1",
    "pypdf>=6.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]

[project.scripts]
hmd = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
